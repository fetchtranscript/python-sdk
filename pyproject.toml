[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fetchtranscript"
version = "0.1.3"
description = "Official Python SDK for the FetchTranscript YouTube API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "FetchTranscript" }]
keywords = ["youtube", "transcript", "subtitles", "captions", "api", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.22.0",
]

[project.urls]
Repository = "https://github.com/fetchtranscript/python-sdk"
Homepage = "https://fetchtranscript.com"
Documentation = "https://fetchtranscript.com/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/fetchtranscript"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
